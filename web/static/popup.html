<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      body {
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 12px 14px;
        width: 280px;
      }
      #host {
        font-weight: 600;
        margin-bottom: 6px;
        overflow-wrap: anywhere;
      }
      #status {
        margin: 0 0 12px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #model {
        margin-top: 10px;
        font-size: 11px;
        color: GrayText;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <p id="status"></p>
    <label><input type="checkbox" id="enabled" /> Handle banners on this site</label>
    <div id="model"></div>
    <script src="popup.js"></script>
  </body>
</html>
