name: RejectCookies
options:
  bundleIdPrefix: ai.sebastiaan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: KW734APFC5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  RejectCookies:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sebastiaan.RejectCookies
        PRODUCT_NAME: Reject Cookies
        INFOPLIST_KEY_CFBundleDisplayName: Reject Cookies
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/RejectCookies.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - target: RejectCookiesExtension
  RejectCookiesExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes: [Resources]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sebastiaan.RejectCookies.Extension
        PRODUCT_NAME: Reject Cookies Extension
        INFOPLIST_KEY_CFBundleDisplayName: Reject Cookies
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Extension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/RejectCookiesExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    postCompileScripts:
      # Safari reads manifest.json from the top of the extension's Resources folder.
      - name: Build web extension
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$HOME/.bun/bin:$PATH"
          cd "$SRCROOT/web" && bun install --frozen-lockfile && bun run build
          ditto "$SRCROOT/Extension/Resources" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
  RejectCookiesTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sebastiaan.RejectCookies.Tests
schemes:
  RejectCookies:
    build:
      targets:
        RejectCookies: all
    test:
      targets: [RejectCookiesTests]
